# TrimUI Brick 局域网 NAS (DLNA / UPnP) 视频同步配置
# 修改后请在掌机「视频」列表里点击【🔄 刷新 NAS 列表】一键同步

[nas]
# NAS 的局域网 IP 地址 (例如 192.168.31.253)
ip = 192.168.31.253

# DLNA / UPnP 服务端口 (群晖 Synology 默认 50001，其他 NAS 常见为 8200、1900 或 50001)
port = 50001

# 可选：指定仅同步特定文件夹 (如 Movie、TV_Show 等；留空表示同步 NAS 视频根目录下的所有文件夹)
folder = 

# 扫描最大目录层级深度 (默认 4)
max_depth = 4