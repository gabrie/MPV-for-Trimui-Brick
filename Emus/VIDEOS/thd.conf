# ==============================================================================
# thd.conf - Triggerhappy Daemon Configuration for mpv on TrimUI Brick
# Direct hardware input event listener via Linux /dev/input/event3
# Writes control commands to mpv FIFO: /tmp/mpv.fifo
# ==============================================================================

# A 键 (305 / BTN_B): 播放 / 暂停 (cycle pause)
BTN_B 1 echo "cycle pause" > /tmp/mpv.fifo

# B 键 (304 / BTN_GAMEPAD): 退出播放 (quit)
BTN_GAMEPAD 1 echo "quit" > /tmp/mpv.fifo

# X 键 (308 / BTN_WEST): 音量加 5%
BTN_WEST 1 echo "add volume 5" > /tmp/mpv.fifo

# Y 键 (307 / BTN_NORTH): 音量减 5%
BTN_NORTH 1 echo "add volume -5" > /tmp/mpv.fifo

# L1 键 (310 / BTN_TL): 播放减速 (0.9x)
BTN_TL 1 echo "multiply speed 0.90909" > /tmp/mpv.fifo

# R1 键 (311 / BTN_TR): 播放加速 (1.1x)
BTN_TR 1 echo "multiply speed 1.1" > /tmp/mpv.fifo

# L2 键 (ABS_Z:255): 快退 60 秒
ABS_Z 255 echo "seek -60" > /tmp/mpv.fifo

# R2 键 (ABS_RZ:255): 快进 60 秒
ABS_RZ 255 echo "seek 60" > /tmp/mpv.fifo

# 十字键 (ABS_HAT0X / ABS_HAT0Y): 方向微调
# 左: 快退 5 秒 / 右: 快进 5 秒
ABS_HAT0X -1 echo "seek -5" > /tmp/mpv.fifo
ABS_HAT0X 1 echo "seek 5" > /tmp/mpv.fifo

# 上: 快进 30 秒 / 下: 快退 30 秒
ABS_HAT0Y -1 echo "seek 30" > /tmp/mpv.fifo
ABS_HAT0Y 1 echo "seek -30" > /tmp/mpv.fifo

# START 键 (315 / BTN_START): 播放 / 暂停 (cycle pause)
BTN_START 1 echo "cycle pause" > /tmp/mpv.fifo

# SELECT 键 (314 / BTN_SELECT): 静音切换 (cycle mute)
BTN_SELECT 1 echo "cycle mute" > /tmp/mpv.fifo

# MENU 键 (316 / BTN_MODE): 长按 1.2 秒强制退出 mpv (兜底安全机制)
BTN_MODE 1 sleep 1.2; killall -9 mpv;
